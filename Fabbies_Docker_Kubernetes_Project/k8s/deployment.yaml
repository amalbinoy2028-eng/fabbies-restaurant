apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabbies-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fabbies
  template:
    metadata:
      labels:
        app: fabbies
    spec:
      containers:
        - name: fabbies-web
          image: fabbies-restaurant:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
